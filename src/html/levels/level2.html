<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypingSimulator - Уровень 2: Метеоритный дождь</title>
    <link rel="stylesheet" href="../../css/style_level2.css">
</head>
<body>

<div class="overl" id="overlay"></div>
<div class="modal-pause" id="modal-pause">
    <p class="modal-pause-content">ПАУЗА</p>
</div>

<header class="game-header">
    <button id="btn-back" class="btn btn-secondary" onclick="window.location.href='../main/main.html'">← В главное меню</button>
    <h1 class="level-title">Уровень 2: Метеоритный дождь</h1>
    <button id="btn-restart" class="btn btn-secondary">↻ Перезапуск</button>
</header>

<main class="game-container">
    <div class="live-stats">
        <div class="stat-box">
            <span class="stat-label">Скорость:</span>
            <span id="live-wpm" class="stat-value">0 зн/мин</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Точность:</span>
            <span id="live-accuracy" class="stat-value">100%</span>
        </div>
    </div>

    <div class="progress-container">
        <div id="progress-bar" class="progress-fill" style="width: 0%;"></div>
    </div>
</main>

<div id="result-modal" class="modal hidden">
    <div class="modal-content">
        <h2>Уровень пройден!</h2>
        <div class="final-stats">
            <p>Скорость: <strong id="final-wpm">120</strong> зн/мин</p>
            <p>Точность: <strong id="final-accuracy">98</strong>%</p>
        </div>

        <form id="save-result-form" class="save-form">
            <label for="player-name">Введите ваш никнейм:</label>
            <input type="text" id="player-name" placeholder="Имя игрока" required>
            <button type="submit" id="btn-save" class="btn btn-primary">Сохранить результат</button>
        </form>

        <div class="modal-actions">
            <button id="btn-modal-restart" class="btn btn-secondary">Сыграть еще раз</button>
            <button id="btn-next-level" class="btn btn-primary" onclick="window.location.href='level3.html'">Следующий уровень</button>
        </div>
    </div>
</div>

<script src="../../js/keyboardHandler.js"></script>
<script src="../../js/Game.js"></script>
<script src="../../js/meteorGame.js"></script>
<script>
    (function() {
        'use strict';

        document.addEventListener('DOMContentLoaded', function() {
            var form = document.getElementById('save-result-form');
            var nameInput = document.getElementById('player-name');
            var saveBtn = document.getElementById('btn-save');

            if (!form) {
                console.warn('Form not found');
                return;
            }

            form.addEventListener('submit', async function(event) {
                event.preventDefault();

                var name = nameInput ? nameInput.value.trim() : '';

                if (!name) {
                    alert('Please enter your nickname');
                    if (nameInput) nameInput.focus();
                    return;
                }

                if (name.length < 2) {
                    alert('Nickname must be at least 2 characters');
                    if (nameInput) nameInput.focus();
                    return;
                }

                var wpmEl = document.getElementById('final-wpm');
                var accEl = document.getElementById('final-accuracy');

                var wpm = wpmEl ? parseInt(wpmEl.textContent || '0') : 0;
                var accuracy = accEl ? parseInt(accEl.textContent || '0') : 0;

                var data = {
                    player_name: name,
                    level_id: 2,
                    level_name: 'Level 2',
                    speed: wpm,
                    accuracy: accuracy,
                    score: Math.round(wpm * accuracy / 100)
                };

                if (saveBtn) {
                    saveBtn.disabled = true;
                    saveBtn.textContent = 'Saving...';
                }

                try {
                    console.log('Sending result:', data);

                    var response = await fetch('http://localhost:5000/api/leaders', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    if (!response.ok) {
                        var errorText = await response.text();
                        throw new Error('Error ' + response.status + ': ' + errorText);
                    }

                    var result = await response.json();
                    console.log('Saved successfully:', result);

                    if (saveBtn) {
                        saveBtn.textContent = 'Saved';
                        saveBtn.style.background = '#27ae60';
                    }

                    alert('Result saved successfully');

                } catch (error) {
                    console.error('Error:', error);
                    alert('Save error: ' + error.message + '\nMake sure backend is running (node server.js)');
                    if (saveBtn) {
                        saveBtn.disabled = false;
                        saveBtn.textContent = 'Save Result';
                        saveBtn.style.background = '';
                    }
                }
            });
        });
    })();
</script>
</body>
</html>
