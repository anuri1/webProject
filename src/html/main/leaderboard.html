<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Таблица рекордов</title>
    <link rel="stylesheet" href="main_style.css">
    <style>
        .lb-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .lb-title {
            text-align: center;
            font-size: 2.5rem;
            color: #2c3e50;
        }
        .lb-sub {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .filters {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            color: #667eea;
            transition: 0.3s;
        }
        .filter-btn.active,
        .filter-btn:hover {
            background: #667eea;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background: #2c3e50;
            color: white;
            padding: 12px;
            text-align: left;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #ecf0f1;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .rank-1 { color: #FFD700; font-weight: bold; }
        .rank-2 { color: #C0C0C0; font-weight: bold; }
        .rank-3 { color: #CD7F32; font-weight: bold; }
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-1 { background: #e8f5e9; color: #2e7d32; }
        .badge-2 { background: #fff3e0; color: #e65100; }
        .badge-3 { background: #fce4ec; color: #c62828; }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 40px;
            background: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
        }
        .back-btn:hover { background: #34495e; }
        .center { text-align: center; }
        .loading { text-align: center; padding: 40px; color: #7f8c8d; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .refresh-btn {
            padding: 10px 20px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .refresh-btn:hover { background: #34495e; }
    </style>
</head>
<body>
<div class="lb-container">
    <h1 class="lb-title">🏆 Таблица рекордов</h1>
    <p class="lb-sub">Лучшие результаты игроков</p>

    <div class="top-bar">
        <div class="filters">
            <button class="filter-btn active" data-level="all">Все</button>
            <button class="filter-btn" data-level="1">Ур. 1</button>
            <button class="filter-btn" data-level="2">Ур. 2</button>
            <button class="filter-btn" data-level="3">Ур. 3</button>
        </div>
        <button class="refresh-btn" onclick="loadLeaderboard()">Обновить</button>
    </div>

    <div id="leaderboard">
        <div class="loading">Загрузка рекордов...</div>
    </div>

    <div class="center">
        <a href="main.html" class="back-btn">На главную</a>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:5000/api';
    let currentLevel = null;

    async function loadLeaderboard() {
        const container = document.getElementById('leaderboard');
        container.innerHTML = '<div class="loading">Загрузка...</div>';

        try {
            let url = `${API_URL}/leaders`;
            if (currentLevel) url += `?level_id=${currentLevel}`;

            const response = await fetch(url);
            const data = await response.json();

            if (!data || data.length === 0) {
                container.innerHTML = `
                        <div class="loading">
                              Пока нет рекордов<br>
                            <span style="font-size:0.9rem;color:#95a5a6;">Пройдите уровень и сохраните результат!</span>
                        </div>
                    `;
                return;
            }

            let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Игрок</th>
                                <th>Уровень</th>
                                <th>Скорость</th>
                                <th>Точность</th>
                                <th>Очки</th>
                                <th>Дата</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

            data.forEach((row, index) => {
                const rank = index + 1;
                let rankClass = '';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';

                const date = new Date(row.created_at).toLocaleDateString('ru-RU');
                const badgeClass = row.level_id === 1 ? 'badge-1' :
                    row.level_id === 2 ? 'badge-2' : 'badge-3';

                html += `
                        <tr>
                            <td><span class="${rankClass}">#${rank}</span></td>
                            <td><strong>${row.player_name}</strong></td>
                            <td><span class="badge ${badgeClass}">${row.level_name}</span></td>
                            <td>${row.speed} зн/мин</td>
                            <td>${row.accuracy}%</td>
                            <td><strong>${row.score}</strong></td>
                            <td style="font-size:0.9rem;color:#7f8c8d;">${date}</td>
                        </tr>
                    `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        } catch (error) {
            console.error('Ошибка:', error);
            container.innerHTML = `
                    <div class="loading">
                        Ошибка загрузки<br>
                        <span style="font-size:0.9rem;color:#e74c3c;">${error.message}</span>
                    </div>
                `;
        }
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentLevel = btn.dataset.level === 'all' ? null : parseInt(btn.dataset.level);
            loadLeaderboard();
        });
    });
    loadLeaderboard();
</script>
</body>
</html>
